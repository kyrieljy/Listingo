server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_pass http://backend:8000;
  }

  location /files/ {
    proxy_pass http://backend:8000;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
