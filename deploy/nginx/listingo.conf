# Enable only after certificate issuance. Keep ACME HTTP validation reachable.
server {
    listen 80;
    server_name listingo.net;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / { return 301 https://listingo.net$request_uri; }
}

server {
    listen 443 ssl;
    server_name listingo.net;
    ssl_certificate /etc/letsencrypt/live/listingo.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/listingo.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Discard any forwarded address supplied by an Internet client.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
